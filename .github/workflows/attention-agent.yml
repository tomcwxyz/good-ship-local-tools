name: Attention agent pilot

on:
  push:
    branches: [ main ]
    paths:
      - "experiments/attention-agent/**"
      - ".github/workflows/attention-agent.yml"
  pull_request:
    paths:
      - "experiments/attention-agent/**"
      - ".github/workflows/attention-agent.yml"
  workflow_dispatch:

concurrency:
  group: attention-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/attention-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
