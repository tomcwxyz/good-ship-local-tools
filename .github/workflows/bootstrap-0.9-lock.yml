name: bootstrap-0.9-lock

on:
  push:
    branches: [ improve/0.9-release-readiness ]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/0.9-release-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches package metadata.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh 0.9 lockfile metadata'
          git push origin HEAD:improve/0.9-release-readiness
