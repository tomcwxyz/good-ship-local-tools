name: refresh-0.10-lock
on:
  push:
    branches: [improve/0.10-pre1-workflows]
    paths:
      - .github/workflows/refresh-lock-010.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/0.10-pre1-workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile metadata
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh 0.10 lockfile metadata"
          git push origin HEAD:improve/0.10-pre1-workflows
