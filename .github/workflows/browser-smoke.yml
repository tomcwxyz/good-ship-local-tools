name: browser-smoke

on:
  pull_request:
    paths-ignore:
      - "experiments/**"
      - ".github/workflows/attention-agent.yml"
  push:
    branches: [ main ]
    paths-ignore:
      - "experiments/**"
      - ".github/workflows/attention-agent.yml"
  workflow_dispatch:

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1
      - name: Run standalone HTML in Chromium, Firefox and WebKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit
          cp "$GITHUB_WORKSPACE/scripts/browser-smoke.mjs" .
          node browser-smoke.mjs "$GITHUB_WORKSPACE/dist"
      - name: Dry-run release packaging
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          bash scripts/package-release.sh "$VERSION" "$RUNNER_TEMP/release-dry-run"
