name: build
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated lockfile to PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/contents/package-lock.json" \
            -f message='Commit clean Node 22 lockfile' \
            -f content="$(base64 -w0 package-lock.json)" \
            -f branch="${{ github.head_ref }}"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/upload-artifact@v4
        with:
          name: local-tools-dist
          path: dist
