name: build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/upload-artifact@v4
        with:
          name: local-tools-dist
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
