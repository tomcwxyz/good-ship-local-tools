name: build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "experiments/**"
      - ".github/workflows/attention-agent.yml"
  pull_request:
    paths-ignore:
      - "experiments/**"
      - ".github/workflows/attention-agent.yml"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/upload-artifact@v4
        with:
          name: local-tools-dist
          path: dist
      - run: npm run build:hosted
      - run: npm run verify:hosted
      - uses: actions/upload-artifact@v4
        with:
          name: sets-hosted-dist
          path: dist-hosted
