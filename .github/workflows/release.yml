name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1
      - name: Cross-browser standalone smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit
          cp "$GITHUB_WORKSPACE/scripts/browser-smoke.mjs" .
          node browser-smoke.mjs "$GITHUB_WORKSPACE/dist"
      - name: Package verified release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

          ASSET_DIR="$RUNNER_TEMP/release-assets"
          BUNDLE_NAME="good-ship-local-tools-$VERSION"
          BUNDLE_DIR="$RUNNER_TEMP/$BUNDLE_NAME"
          mkdir -p "$ASSET_DIR" "$BUNDLE_DIR"
          cp -R dist/. "$BUNDLE_DIR/"
          cp LICENSE NOTICE README.md "$BUNDLE_DIR/"
          (cd "$RUNNER_TEMP" && zip -qr "$ASSET_DIR/$BUNDLE_NAME.zip" "$BUNDLE_NAME")

          cp LICENSE NOTICE "$ASSET_DIR/"
          cp dist/index.html "$ASSET_DIR/good-ship-local-tools-$VERSION-launcher.html"
          for entry in dist/tools/*/index.html; do
            tool="$(basename "$(dirname "$entry")")"
            cp "$entry" "$ASSET_DIR/good-ship-local-tools-$VERSION-$tool.html"
          done

          (
            cd "$ASSET_DIR"
            sha256sum *.html *.zip LICENSE NOTICE | sort -k2 > RELEASE-SHA256SUMS.txt
            sha256sum -c RELEASE-SHA256SUMS.txt
          )
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.asset_dir }}"/* \
            --title "Good Ship Local Tools $GITHUB_REF_NAME" \
            --generate-notes
