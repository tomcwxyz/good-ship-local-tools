name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1
      - name: Cross-browser standalone smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit
          cp "$GITHUB_WORKSPACE/scripts/browser-smoke.mjs" .
          node browser-smoke.mjs "$GITHUB_WORKSPACE/dist"
      - name: Package verified release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-release.sh "$VERSION" "$RUNNER_TEMP/release-assets"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"/* \
            --title "Good Ship Local Tools $GITHUB_REF_NAME" \
            --generate-notes
